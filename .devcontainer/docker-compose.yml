services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: passly-styleguide-devcontainer
    volumes:
      - ..:/workspaces/passly-styleguide:cached
      - ${HOME}/.claude:/home/node/.claude:cached
      - ${HOME}/.claude/managed-settings:/etc/claude-code:ro
    command: sleep infinity
    ports:
      - "6006:6006"
